# Fields:
#   id: unique slot identifier (int or str)
#   name: human-readable descriptor
#   surface: mounting surface ("wall_...", "floor", etc.)
#   position: [x, y, z] in world/map coordinates (meters)
#   orientation: [roll, pitch, yaw] in radians
#   type_affinity: list of object types suitable for this slot ("rust", "leak", "aruco", "distractor")

